<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogdan Ski Experience</title>
  <style>
    * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    h1 { text-align: center; margin-bottom: 12px; }
    #status { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { position: relative; background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .media-wrapper { position: relative; width: 100%; height: 240px; overflow: hidden; }
    .media-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .shield { position: absolute; inset: 0; z-index: 10; background: transparent; }
    .watermark-overlay {
      position: absolute; bottom: 8px; right: 10px; z-index: 5;
      font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.45);
      pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">
  <h1>DubShot Ski Experience</h1>
  <div id="status">Se încarcă galeria protejată...</div>
  <div class="grid" id="gallery"></div>

  <script>
    const SUPABASE_URL = 'https://jxswyigfwqjqgofdvxgn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4c3d5aWdmd3FqcWdvZmR2eGduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MTI0NzMsImV4cCI6MjExMTI4ODQ3M30.Lgguav5F0LfubrCGafi5W8WgR0pt1i3-fCAMYie-Zkg'
    const BUCKET_NAME = 'DubShot';

    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && ['s', 'S', 'u', 'U', 'p', 'P'].includes(e.key)) ||
        (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key))
      ) {
        e.preventDefault();
      }
    });

    async function loadFiles() {
      const statusEl = document.getElementById('status');
      const galleryEl = document.getElementById('gallery');

      try {
        const endpoint = SUPABASE_URL + '/storage/v1/object/list/' + BUCKET_NAME;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            prefix: '',

            offset: 0,
            sortBy: { column: 'created_at', order: 'desc' }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || 'Eroare HTTP ' + response.status);
        }

        const files = (data || []).filter(item => item.name !== '.emptyFolderPlaceholder' && item.id !== null);
        if (!files.length) {
          statusEl.textContent = 'Conectat, dar nu s-au găsit poze.';
          return;
        }

        statusEl.textContent = files.length + ' fotografii (Vizualizare protejată)';

        files.forEach((file, index) => {
          const url = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET_NAME + '/' + encodeURIComponent(file.name);
          const ext = file.name.split('.').pop().toLowerCase();

          const card = document.createElement('div');
          card.className = 'card';

          if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
            card.innerHTML = `
              <div class="media-wrapper">
                <img src="${url}" alt="Fotografie ${index + 1}" draggable="false" />
                <div class="watermark-overlay">© DubShot</div>
                <div class="shield"></div>
              </div>
              <div class="card-body">Foto #${index + 1}</div>
            `;
          } else if (['mp4', 'webm', 'mov'].includes(ext)) {
            card.innerHTML = `
              <div class="media-wrapper">
                <video src="${url}" controls controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false;" style="width:100%;height:100%;object-fit:cover;"></video>
              </div>
              <div class="card-body">Video #${index + 1}</div>
            `;
          }

          galleryEl.appendChild(card);
        });
      } catch (err) {
        statusEl.style.color = '#f87171';
        statusEl.textContent = 'Eroare: ' + err.message;
      }
    }

    loadFiles();
  </script>
</body>
</html>
