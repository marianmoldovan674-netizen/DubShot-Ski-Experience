<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DubShot Ski Experience</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    h1 { text-align: center; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .card img, .card video { width: 100%; height: 220px; object-fit: cover; display: block; }
    .card-body { padding: 12px; font-size: 14px; word-break: break-all; }
    .card-body a { color: #38bdf8; text-decoration: none; font-weight: 600; }
    #status { text-align: center; color: #94a3b8; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>DubShot Ski Experience</h1>
  <div id="status">Se încarcă fișierele din Supabase...</div>
  <div class="grid" id="gallery"></div>

  <script>
    const SUPABASE_URL = 'https://jxswyigfwqjqgofdvxgn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_TdsyNbAIs0QwSX3XpBwQvg_uhrG1UuI';
    const BUCKET_NAME = 'DubShot';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadFiles() {
      const statusEl = document.getElementById('status');
      const galleryEl = document.getElementById('gallery');

      const { data, error } = await client.storage.from(BUCKET_NAME).list('', {
        limit: 100,
        sortBy: { column: 'created_at', order: 'desc' }
      });

      if (error) {
        statusEl.textContent = 'Eroare la conectare: ' + error.message;
        return;
      }

      const files = data.filter(item => item.name !== '.emptyFolderPlaceholder' && item.id !== null);
      if (!files.length) {
        statusEl.textContent = 'Nu s-au găsit fișiere direct în rădăcina bucket-ului DubShot.';
        return;
      }

      statusEl.textContent = ${files.length} fișiere găsite;

      files.forEach(file => {
        const { data: urlData } = client.storage.from(BUCKET_NAME).getPublicUrl(file.name);
        const url = urlData.publicUrl;
        const ext = file.name.split('.').pop().toLowerCase();

        const card = document.createElement('div');
        card.className = 'card';

        if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
          card.innerHTML = <img src="${url}" alt="${file.name}" /><div class="card-body"><a href="${url}" target="_blank">${file.name}</a></div>;
        } else if (['mp4', 'webm', 'mov'].includes(ext)) {
          card.innerHTML = <video src="${url}" controls></video><div class="card-body"><a href="${url}" target="_blank">${file.name}</a></div>;
        } else {
          card.innerHTML = <div class="card-body">📄 <a href="${url}" target="_blank">${file.name}</a></div>;
        }

        galleryEl.appendChild(card);
      });
    }

    loadFiles();
  </script>
</body>
</html>
